name: Publish image to GHCR

on:
  workflow_dispatch:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+" # SemVer release
      - "[0-9]+.[0-9]+.[0-9]+-**" # SemVer pre-release

defaults:
  run:
    shell: bash

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Docker Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.7.1

      - name: Cache Parameters
        id: cache_params
        run: |
          CACHE_SCOPE="cal-itp"

          echo "cache_from_args=type=gha,scope=${CACHE_SCOPE},ref=${{ github.ref }}" >> $GITHUB_OUTPUT
          echo "cache_to_args=type=gha,scope=${CACHE_SCOPE},mode=max,ref=${{ github.ref }}" >> $GITHUB_OUTPUT

      - name: Build, tag, and push image to GitHub Container Registry
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          build-args: GIT-SHA=${{ github.sha }}
          cache-from: ${{ steps.cache_params.outputs.cache_from_args }}
          cache-to: ${{ steps.cache_params.outputs.cache_to_args }}
          context: .
          platforms: linux/amd64,linux/arm64
          file: appcontainer/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:${{ github.sha }}

  release:
    needs: publish
    # signifies a SemVer pre-release https://semver.org/#spec-item-9
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      # https://github.com/softprops/action-gh-release#permissions
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          fetch-depth: 0

      - name: Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          prerelease: false
          generate_release_notes: true
